<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#ffe3ee;
    --bg-bottom:#ffc8dd;
    --rose-deep:#d6336c;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    overflow-x:hidden;
    background:linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 55%, #ffd6e8 100%);
    font-family:'Quicksand', sans-serif;
  }

  .scene{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:6vh 16px 4vh;
    overflow:hidden;
  }

  .bokeh{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), rgba(255,255,255,0) 70%);
    pointer-events:none;
    z-index:0;
  }

  /* floating hearts layer */
  .hearts-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    overflow:hidden;
  }

  .heart{
    position:absolute;
    bottom:-60px;
    opacity:0;
    will-change:transform, opacity;
    animation-name:floatUp;
    animation-timing-function:ease-in;
    animation-iteration-count:infinite;
  }

  .heart svg{
    display:block;
    filter:drop-shadow(0 2px 6px rgba(214,51,108,0.25));
  }

  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) rotate(0deg) scale(var(--s,1)); opacity:0; }
    8%{ opacity:.9; }
    50%{ transform:translateY(-52vh) translateX(var(--sway,18px)) rotate(8deg) scale(var(--s,1)); }
    92%{ opacity:.7; }
    100%{ transform:translateY(-110vh) translateX(calc(var(--sway,18px) * -1)) rotate(-6deg) scale(var(--s,1)); opacity:0; }
  }

  h1.sorry{
    position:relative;
    z-index:3;
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size:clamp(3.4rem, 13vw, 8rem);
    margin:0;
    line-height:1;
    color:var(--rose-deep);
    text-shadow:0 6px 24px rgba(214,51,108,0.28);
    opacity:0;
    transform:translateY(18px) scale(0.92);
    animation:riseIn 1s cubic-bezier(.2,.8,.2,1) 0.25s forwards;
  }

  @keyframes riseIn{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .bouquet-wrap{
    position:relative;
    z-index:2;
    width:min(640px, 96vw);
    margin-top:1.5rem;
    opacity:0;
    animation:bouquetIn 1.1s cubic-bezier(.2,.7,.3,1) 0.45s forwards;
  }

  @keyframes bouquetIn{
    0%{ opacity:0; transform:translateY(40px) scale(0.88) rotate(-2deg); }
    100%{ opacity:1; transform:translateY(0) scale(1) rotate(0deg); }
  }

  .bouquet-wrap svg{
    display:block;
    width:100%;
    filter:drop-shadow(0 22px 36px rgba(123, 40, 79, 0.25));
  }

  .sway{
    animation:gentleSway 6s ease-in-out infinite;
    transform-origin:50% 95%;
  }

  @keyframes gentleSway{
    0%,100%{ transform:rotate(-1deg); }
    50%{ transform:rotate(1deg); }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="hearts-layer" id="heartsLayer"></div>

<div class="scene">
  <div class="bokeh" style="width:260px;height:260px;top:4%;left:-6%;"></div>
  <div class="bokeh" style="width:200px;height:200px;top:60%;right:-4%;"></div>
  <div class="bokeh" style="width:150px;height:150px;top:14%;right:8%;"></div>

  <h1 class="sorry">I'm Sorry</h1>

  <div class="bouquet-wrap">
    <svg class="sway" viewBox="0 0 600 620" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="rPink1" cx="35%" cy="28%" r="75%">
          <stop offset="0%" stop-color="#ffe1ec"/>
          <stop offset="55%" stop-color="#ff8fab"/>
          <stop offset="100%" stop-color="#e85d83"/>
        </radialGradient>
        <radialGradient id="rPink2" cx="35%" cy="28%" r="75%">
          <stop offset="0%" stop-color="#fff0f5"/>
          <stop offset="55%" stop-color="#ffb3c6"/>
          <stop offset="100%" stop-color="#f0839e"/>
        </radialGradient>
        <radialGradient id="rPinkLight" cx="35%" cy="28%" r="75%">
          <stop offset="0%" stop-color="#fff7fa"/>
          <stop offset="55%" stop-color="#ffd3e0"/>
          <stop offset="100%" stop-color="#f4a8bc"/>
        </radialGradient>
        <radialGradient id="rPurple1" cx="35%" cy="28%" r="75%">
          <stop offset="0%" stop-color="#e9d6f7"/>
          <stop offset="55%" stop-color="#b07ccb"/>
          <stop offset="100%" stop-color="#8a4ea8"/>
        </radialGradient>
        <radialGradient id="rPurple2" cx="35%" cy="28%" r="75%">
          <stop offset="0%" stop-color="#f0e2fb"/>
          <stop offset="55%" stop-color="#c79bdb"/>
          <stop offset="100%" stop-color="#9d6cb8"/>
        </radialGradient>

        <linearGradient id="paperLilac" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#d9bce8"/>
          <stop offset="100%" stop-color="#b98fd0"/>
        </linearGradient>
        <linearGradient id="paperLilac2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#e6cdf0"/>
          <stop offset="100%" stop-color="#c8a0db"/>
        </linearGradient>
        <linearGradient id="paperBlush" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f6d6e3"/>
          <stop offset="100%" stop-color="#e9aec5"/>
        </linearGradient>
        <linearGradient id="paperBlush2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fbe5ee"/>
          <stop offset="100%" stop-color="#eebccf"/>
        </linearGradient>

        <!-- rose symbol: layered cupped petals, drawn pointing up, recentre at 0,0 -->
        <g id="rose">
          <g>
            <path d="M0,-24 C9,-24 15,-16 13,-6 C11,3 3,8 0,8 C-3,8 -11,3 -13,-6 C-15,-16 -9,-24 0,-24 Z" transform="rotate(0)"/>
            <path d="M0,-24 C9,-24 15,-16 13,-6 C11,3 3,8 0,8 C-3,8 -11,3 -13,-6 C-15,-16 -9,-24 0,-24 Z" transform="rotate(60)"/>
            <path d="M0,-24 C9,-24 15,-16 13,-6 C11,3 3,8 0,8 C-3,8 -11,3 -13,-6 C-15,-16 -9,-24 0,-24 Z" transform="rotate(120)"/>
            <path d="M0,-24 C9,-24 15,-16 13,-6 C11,3 3,8 0,8 C-3,8 -11,3 -13,-6 C-15,-16 -9,-24 0,-24 Z" transform="rotate(180)"/>
            <path d="M0,-24 C9,-24 15,-16 13,-6 C11,3 3,8 0,8 C-3,8 -11,3 -13,-6 C-15,-16 -9,-24 0,-24 Z" transform="rotate(240)"/>
            <path d="M0,-24 C9,-24 15,-16 13,-6 C11,3 3,8 0,8 C-3,8 -11,3 -13,-6 C-15,-16 -9,-24 0,-24 Z" transform="rotate(300)"/>
          </g>
          <g transform="rotate(28) scale(0.62)" opacity="0.95">
            <path d="M0,-24 C9,-24 15,-16 13,-6 C11,3 3,8 0,8 C-3,8 -11,3 -13,-6 C-15,-16 -9,-24 0,-24 Z" transform="rotate(0)"/>
            <path d="M0,-24 C9,-24 15,-16 13,-6 C11,3 3,8 0,8 C-3,8 -11,3 -13,-6 C-15,-16 -9,-24 0,-24 Z" transform="rotate(60)"/>
            <path d="M0,-24 C9,-24 15,-16 13,-6 C11,3 3,8 0,8 C-3,8 -11,3 -13,-6 C-15,-16 -9,-24 0,-24 Z" transform="rotate(120)"/>
            <path d="M0,-24 C9,-24 15,-16 13,-6 C11,3 3,8 0,8 C-3,8 -11,3 -13,-6 C-15,-16 -9,-24 0,-24 Z" transform="rotate(180)"/>
            <path d="M0,-24 C9,-24 15,-16 13,-6 C11,3 3,8 0,8 C-3,8 -11,3 -13,-6 C-15,-16 -9,-24 0,-24 Z" transform="rotate(240)"/>
            <path d="M0,-24 C9,-24 15,-16 13,-6 C11,3 3,8 0,8 C-3,8 -11,3 -13,-6 C-15,-16 -9,-24 0,-24 Z" transform="rotate(300)"/>
          </g>
          <circle r="4.5" cy="-2" fill="rgba(120,30,60,0.25)"/>
        </g>
      </defs>

      <!-- ===== paper wrap (drawn first, behind dome) ===== -->
      <g id="paperWrap">
        <!-- back lilac petals -->
        <path d="M300 360 C 200 380, 90 420, 40 540 C 130 560, 230 520, 300 470 Z" fill="url(#paperLilac)"/>
        <path d="M300 360 C 400 380, 510 420, 560 540 C 470 560, 370 520, 300 470 Z" fill="url(#paperLilac2)"/>
        <!-- side ruffles -->
        <path d="M300 380 C 230 400, 150 460, 130 580 C 210 590, 270 540, 300 470 Z" fill="url(#paperBlush)"/>
        <path d="M300 380 C 370 400, 450 460, 470 580 C 390 590, 330 540, 300 470 Z" fill="url(#paperBlush2)"/>
        <!-- front center ruffle fan -->
        <path d="M300 390 C 260 430, 230 500, 245 600 C 280 580, 300 520, 300 470 Z" fill="url(#paperBlush2)"/>
        <path d="M300 390 C 340 430, 370 500, 355 600 C 320 580, 300 520, 300 470 Z" fill="url(#paperBlush)"/>
        <path d="M300 400 C 280 450, 270 520, 300 605 C 330 520, 320 450, 300 400 Z" fill="url(#paperLilac2)" opacity="0.9"/>
        <!-- crisp fold lines -->
        <g stroke="rgba(255,255,255,0.35)" stroke-width="3" fill="none" stroke-linecap="round">
          <path d="M300 400 C 270 450, 255 520, 262 580"/>
          <path d="M300 400 C 330 450, 345 520, 338 580"/>
          <path d="M260 400 C 200 440, 150 490, 130 560"/>
          <path d="M340 400 C 400 440, 450 490, 470 560"/>
        </g>
      </g>

      <!-- ===== rose dome (generated by script) ===== -->
      <g id="roseDome"></g>
    </svg>
  </div>
</div>

<script>
  // generate floating hearts
  const layer = document.getElementById('heartsLayer');
  const HEART_SVG = (color) => `
    <svg width="100%" height="100%" viewBox="0 0 32 29">
      <path d="M16 28 C16 28 1 18.5 1 8.8 C1 3.6 5.2 0.5 9.6 0.5 C12.6 0.5 15 2.2 16 4.6 C17 2.2 19.4 0.5 22.4 0.5 C26.8 0.5 31 3.6 31 8.8 C31 18.5 16 28 16 28 Z" fill="${color}"/>
    </svg>`;

  const heartColors = ['#ff4d6d', '#e63950', '#ff7a93', '#d6336c'];
  const totalHearts = 22;

  for (let i = 0; i < totalHearts; i++) {
    const heart = document.createElement('div');
    heart.className = 'heart';
    const size = 14 + Math.random() * 22;
    const left = Math.random() * 100;
    const duration = 9 + Math.random() * 8;
    const delay = Math.random() * 12;
    const sway = (Math.random() * 60 + 10) * (Math.random() < 0.5 ? -1 : 1);
    const scale = 0.7 + Math.random() * 0.9;
    const color = heartColors[Math.floor(Math.random() * heartColors.length)];

    heart.style.left = left + 'vw';
    heart.style.width = size + 'px';
    heart.style.height = size + 'px';
    heart.style.setProperty('--sway', sway + 'px');
    heart.style.setProperty('--s', scale);
    heart.style.animationDuration = duration + 's';
    heart.style.animationDelay = delay + 's';
    heart.innerHTML = HEART_SVG(color);
    layer.appendChild(heart);
  }

  // generate the dense rose dome
  const roseColors = ['url(#rPink1)','url(#rPink2)','url(#rPurple1)','url(#rPurple2)','url(#rPink1)','url(#rPurple1)','url(#rPinkLight)','url(#rPurple2)'];
  const domeGroup = document.getElementById('roseDome');

  // dome ellipse: center (300, 250), radii (240, 175), roses packed inside, denser near center/bottom
  const cx = 300, cy = 250, rx = 245, ry = 175;
  const roses = [];
  const count = 130;
  let attempts = 0;

  while (roses.length < count && attempts < 4000) {
    attempts++;
    const a = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.random()); // bias toward edge slightly less dense at very center? sqrt gives uniform area dist
    const x = cx + Math.cos(a) * rx * r;
    const y = cy + Math.sin(a) * ry * r * 0.96 - (Math.random() * 6);
    if (y > cy + ry * 0.98) continue; // keep within dome
    // reject if too close to an existing rose (avoid huge overlap gaps)
    let tooClose = false;
    for (const p of roses) {
      const dx = p.x - x, dy = p.y - y;
      if (Math.sqrt(dx*dx + dy*dy) < 26) { tooClose = true; break; }
    }
    if (tooClose) continue;
    roses.push({ x, y });
  }

  // sort back-to-front: higher up (smaller y) drawn first, lower (larger y) drawn after for natural overlap
  roses.sort((a, b) => a.y - b.y);

  roses.forEach((p, i) => {
    const depth = (p.y - (cy - ry)) / (ry * 2); // 0 at top, 1 near bottom
    const scale = 0.85 + depth * 0.55 + Math.random() * 0.18;
    const rot = Math.random() * 360;
    const color = roseColors[Math.floor(Math.random() * roseColors.length)];
    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', '#rose');
    use.setAttribute('transform', `translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${scale.toFixed(2)})`);
    use.setAttribute('fill', color);
    domeGroup.appendChild(use);
  });
</script>

</body>
</html>
